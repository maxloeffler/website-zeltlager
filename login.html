<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Startseite - KjG Lautzkirchen </title>
    <link rel="stylesheet" href=style.css>
    <link rel="shortcut icon" href="./bilder/seelenbohrer.webp" type="image/x-icon">
    <script src="script.js"></script>
  </head>
  <body>

    <div class="header no-select">
      <div class="horizontal">
        <a href="/zeltlager">
          <div class="logo">
            <img src="bilder/seelenbohrer.webp" alt="KjG Logo">
            KjG Lautzkirchen
          </div>
        </a>
        <div class="tabs">
          Mail
        </div>
      </div>
      <div class="fortschritt"></div>
    </div>

    <div class="main index">
      <div class="inhalt mail">
        <form action="/login" method="post">
          <input type="text" id="user" name="name" placeholder="Dein Name">
          <input type="text" id="pass" name="password" placeholder="Dein Passwort">
          <button type="submit">Login</button>
        </form>
      </div>
    </div>

    <footer>
      <div class="kontakt">
          <img src="bilder/instagram.webp" alt="Instagram Logo" onclick="window.location='https://www.instagram.com/kjg.lautzkirchen'">
          <img src="bilder/facebook.webp" alt="Facebook Logo" onclick="window.location='https://www.facebook.com/100064357975045'">
          <img src="bilder/mail.webp" alt="Email Logo" onclick="window.location='mailto:kjg-lautzkirchen-zeltlager@gmx.de'">
          <img src="bilder/phone.webp" alt="Phone Logo" onclick="window.location='tel:+49 15776947321'">
      </div>
      <a href="/impressum">
        © KjG 2026. Alle Rechte vorbehalten - Impressum
      </a>
    </footer>
  </body>
</html>
